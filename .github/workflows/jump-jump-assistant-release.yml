name: jump-jump-assistant release

on:
  push:
    tags: ['jump-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jump-jump-assistant/android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.3 不接受 JDK 25，必须 17~21
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 自带 Android SDK（ANDROID_HOME 已设），不需要 setup-android
      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#jump-v}"
          for f in build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/.*-(arm64-v8a|x86_64)-debug\.apk/\1/')
            cp "$f" "dist/JumpAssist-${VERSION}-${abi}.apk"
          done
          ls -l dist/

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jump-jump-assistant-apks
          path: jump-jump-assistant/android/dist/*.apk

      - name: Attach to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: jump-jump-assistant/android/dist/*.apk
          generate_release_notes: true
          body: |
            真机装 `arm64-v8a`，MuMu 等 x86_64 模拟器装 `x86_64`。

            debug 签名，直接 `adb install -r` 或点开安装即可（需允许安装未知来源）。
            用法与构建细节见 [`jump-jump-assistant/README.md`](https://github.com/wyhc7/little-toys/blob/main/jump-jump-assistant/README.md)。
