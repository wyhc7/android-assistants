name: jump-jump-assistant

on:
  push:
    branches: [main]
    paths:
      - 'jump-jump-assistant/**'
      - '.github/workflows/jump-jump-assistant.yml'
  pull_request:
    paths:
      - 'jump-jump-assistant/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jump-jump-assistant/android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.3 涓嶆帴鍙?JDK 25锛屽繀椤?17~21
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 涓嶇敤 android-actions/setup-android: 瀹冪殑 sdkmanager 浼氬幓鎵惧凡涓嬫灦鐨?'tools' 鍖呰€屽け璐?
      # ubuntu runner 鑷甫 SDK(ANDROID_HOME 宸茶), 鐩存帴缂栧嵆鍙€?      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jump-jump-assistant-debug
          path: jump-jump-assistant/android/build/outputs/apk/debug/*.apk
