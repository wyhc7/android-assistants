name: miao-assistant

on:
  push:
    branches: [main]
    paths:
      - 'miao-assistant/**'
      - '.github/workflows/miao-assistant*.yml'
  pull_request:
    paths:
      - 'miao-assistant/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miao-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoAssistant-debug
          path: miao-assistant/app/build/outputs/apk/debug/app-debug.apk
